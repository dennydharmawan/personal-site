    <text x="82" y="226" fill="#cbd5e1">Catalog</text>
    <text x="82" y="292" fill="#cbd5e1">Checkout</text>
    <text x="82" y="358" fill="#cbd5e1">Payments</text>
    <text x="82" y="424" fill="#cbd5e1">Orders</text>
    <text x="82" y="490" fill="#cbd5e1">Webhooks</text>
  </g>
  <rect x="330" y="34" width="1840" height="645" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text x="374" y="88" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="780">E-commerce Payment Platform</text>
  <text x="374" y="124" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="18">Product browsing, checkout, payment states, webhook reconciliation, and order operations.</text>
  <rect x="1828" y="60" width="280" height="46" rx="13" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="1856" y="90" fill="#4338ca" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Payment gateway live</text>
