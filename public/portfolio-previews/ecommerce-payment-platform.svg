    <line x1="1282" x2="2074" y1="500" y2="500" stroke="#e2e8f0"/>
    <text x="1282" y="532" fill="#64748b">10:43</text><text x="1372" y="532" fill="#0f172a">order.created</text><rect x="1730" y="508" width="132" height="32" rx="16" fill="#dcfce7"/><text x="1766" y="530" fill="#15803d">Synced</text>
    <line x1="1282" x2="2074" y1="556" y2="556" stroke="#e2e8f0"/>
    <text x="1282" y="588" fill="#64748b">10:44</text><text x="1372" y="588" fill="#0f172a">inventory.reserved</text><rect x="1730" y="564" width="132" height="32" rx="16" fill="#dcfce7"/><text x="1766" y="586" fill="#15803d">Synced</text>
  </g>
  <rect x="374" y="616" width="1734" height="30" rx="15" fill="#ede9fe"/>
  <rect x="374" y="616" width="1448" height="30" rx="15" fill="#8b5cf6"/>
  <text x="406" y="638" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Checkout completion 84%</text>
