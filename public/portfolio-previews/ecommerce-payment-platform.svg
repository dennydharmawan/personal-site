  <text x="406" y="202" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="780">Storefront</text>
  <text x="1010" y="202" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">Cart total IDR 1.84m</text>
