    <text x="694" y="448" fill="#64748b" font-size="16" font-weight="650">IDR 249k</text>
    <rect x="694" y="470" width="110" height="30" rx="15" fill="#fef3c7"/><text x="714" y="491" fill="#b45309" font-size="14" font-weight="800">Low stock</text>
    <rect x="942" y="234" width="232" height="282" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
