    <text x="962" y="448" fill="#64748b" font-size="16" font-weight="650">IDR 899k</text>
    <rect x="962" y="470" width="96" height="30" rx="15" fill="#dbeafe"/><text x="982" y="491" fill="#1d4ed8" font-size="14" font-weight="800">Promo</text>
  </g>
  <rect x="1250" y="160" width="858" height="198" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1282" y="202" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="780">Checkout and payment state</text>
