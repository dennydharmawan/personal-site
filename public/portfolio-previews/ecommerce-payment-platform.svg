<svg xmlns="http://www.w3.org/2000/svg" width="2204" height="713" viewBox="0 0 2204 713" role="img" aria-labelledby="title desc">
  <title id="title">E-commerce payment platform preview</title>
  <desc id="desc">Dashboard mockup showing storefront products, checkout, payment integration, webhooks, and order operations.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="sidebar" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="product" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="2204" height="713" fill="#f8fafc"/>
  <rect x="0" y="0" width="292" height="713" fill="url(#sidebar)"/>
  <rect x="30" y="34" width="44" height="44" rx="14" fill="#8b5cf6"/>
  <path d="M41 57h24M45 49l4-8h7l4 8" stroke="#faf5ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="54" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="750">CommerceOS</text>
  <text x="92" y="85" fill="#ddd6fe" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Storefront and payments</text>
