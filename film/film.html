<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Stays up · prototype</title>
<style>
html,body{margin:0;background:#18181b;color:#e4e4e7;font:13px ui-sans-serif,system-ui}
main{max-width:720px;margin:24px auto;padding:0 12px}
canvas{display:block;width:720px;height:720px;max-width:100%;height:auto;aspect-ratio:1}
nav{display:flex;gap:10px;align-items:center;padding:10px 0}
input{flex:1}button{background:#3f3f46;color:inherit;border:0;padding:7px 12px;cursor:pointer;border-radius:4px}
output{font-variant-numeric:tabular-nums;width:4ch;text-align:right}
p{color:#a1a1aa;margin:4px 0}
</style>
<main>
<canvas id="c" width="1080" height="1080"></canvas>
<nav><button id="play">Play</button><input id="scrub" type="range" min="0" value="0" step="0.0333333"><output id="time">0.0</output></nav>
<p id="beat"></p>
<p>Throwaway prototype. Print engine adapted from sevenevesai/riso-windowseat (MIT).</p>
</main>
<script src="palette.js"></script>
<script src="engine.js"></script>
<script src="film.js"></script>
<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const scrub = document.getElementById('scrub'), clock = document.getElementById('time'), beatEl = document.getElementById('beat');
scrub.max = DUR;
const paper = bakePaper();
function render(t) {
  t = clamp(t, 0, DUR);
  drawArt(t);
  compose(ctx, paper);
  scrub.value = t; clock.value = t.toFixed(1);
  const s = [...SHOTS].reverse().find(s => t >= s.at - 1.5);
  beatEl.textContent = s ? s.beat : '';
}
let at = 0, playing = false, epoch = 0;
const btn = document.getElementById('play');
function pause() { if (playing) at = clamp((performance.now() - epoch) / 1000, 0, DUR); playing = false; btn.textContent = 'Play'; }
function play() { if (at >= DUR) at = 0; epoch = performance.now() - at * 1000; playing = true; btn.textContent = 'Pause'; }
function seek(t) { pause(); at = clamp(t, 0, DUR); render(at); }
btn.onclick = () => playing ? pause() : play();
scrub.oninput = () => seek(Number(scrub.value));
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } if (e.code === 'ArrowLeft') seek(at - 1 / 30); if (e.code === 'ArrowRight') seek(at + 1 / 30); });
function tick(now) { if (playing) { at = clamp((now - epoch) / 1000, 0, DUR); render(at); if (at >= DUR) pause(); } requestAnimationFrame(tick); }
window.__riso = { duration: DUR, ready: false, seek, shots: SHOTS };
seek(Number(new URLSearchParams(location.search).get('t')) || 0);
requestAnimationFrame(tick);
window.__riso.ready = true;
</script>
</html>
